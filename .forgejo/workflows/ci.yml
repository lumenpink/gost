name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Validate Specification & Site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify Essential Files"
        run: |
          test -f SPEC.md || { echo "SPEC.md missing"; exit 1; }
          test -f GOSTVER || { echo "GOSTVER missing"; exit 1; }
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          test -f VERSION || { echo "VERSION missing"; exit 1; }
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          test -f site/_headers || { echo "site/_headers missing"; exit 1; }
          test -f specs/pt/SPEC.md || { echo "specs/pt/SPEC.md missing"; exit 1; }
          test -f specs/en/SPEC.md || { echo "specs/en/SPEC.md missing"; exit 1; }
          test -f specs/rules.json || { echo "specs/rules.json missing"; exit 1; }
          test -f specs/languages/php.md || { echo "specs/languages/php.md missing"; exit 1; }
          test -f specs/languages/rust.md || { echo "specs/languages/rust.md missing"; exit 1; }
          test -f specs/languages/shell.md || { echo "specs/languages/shell.md missing"; exit 1; }
          test -f specs/languages/javascript.md || { echo "specs/languages/javascript.md missing"; exit 1; }
          test -f specs/languages/r.md || { echo "specs/languages/r.md missing"; exit 1; }
          test -f upgrades/from-0.1-to-1.0.md || { echo "upgrades/from-0.1-to-1.0.md missing"; exit 1; }
          echo "All essential GOST baseline files, language modules and specifications are present."

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site
