name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  validate:
    name: "Validate Specification & Site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify Essential Files"
        run: |
          test -f SPEC.md || { echo "SPEC.md missing"; exit 1; }
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f UNLICENSE || { echo "UNLICENSE missing"; exit 1; }
          test -f VERSION || { echo "VERSION missing"; exit 1; }
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          test -f site/_headers || { echo "site/_headers missing"; exit 1; }
          echo "All essential GOST baseline files are present."

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site
