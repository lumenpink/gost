[rules.GOST-005]
name = "ZERO-BINARIES-IN-GIT"
severity = "error"
scope = "git-history"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-005"
description = "Zero pre-compiled binary files or libraries (.apk, .exe, .so, .bin, .dll, .dylib) committed in git"
script = '''
local binary_exts = {".apk", ".exe", ".so", ".bin", ".dll", ".dylib"}
local files = gost.git_ls_files()
for _, f in ipairs(files) do
    for _, ext in ipairs(binary_exts) do
        if f:sub(-#ext) == ext then
            return false, "ERR_BINARY_IN_GIT", { file = f }
        end
    end
end
return true
'''
[rules.GOST-005.messages]
ERR_BINARY_IN_GIT = "Pre-compiled binary file detected in git repository: {file}"
