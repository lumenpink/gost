[rules.GOST-003]
name = "VERSION-SEMVER-SYNTAX"
severity = "error"
scope = "root"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-003"
description = "The VERSION file must contain a valid SemVer 2.0.0 semantic version string"
script = '''
if not gost.file_exists("VERSION") then
    return false, "ERR_VERSION_MISSING", {}
end
local ver = gost.read_file("VERSION"):match("^%s*(.-)%s*$")
if not ver or #ver == 0 then
    return false, "ERR_VERSION_EMPTY", {}
end
local clean_ver = ver:match("^v?(%d+%.%d+%.%d+.*)$")
if not clean_ver then
    return false, "ERR_VERSION_SEMVER_INVALID", { version = ver }
end
return true
'''
[rules.GOST-003.messages]
ERR_VERSION_MISSING = "VERSION file is missing"
ERR_VERSION_EMPTY = "VERSION file is empty"
ERR_VERSION_SEMVER_INVALID = "Version '{version}' is not a valid SemVer 2.0 string"

