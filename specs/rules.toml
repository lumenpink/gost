# GOST v3.0.0 — Canonical Rules Specification (rules.toml)
# Universal Declarative Conformance Rules with Embedded Lua Validation Scripts
# Tier 1: Fundamental Axioms (5 Universal Repository Integrity Rules)

[rules.GOST-001]
name = "GOSTVER-FILE-REQUIRED"
severity = "error"
scope = "root"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-001"
description = "The repository must contain a non-empty GOSTVER file in the root directory declaring its GOST specification"
script = '''
if not gost.file_exists("GOSTVER") then
    return false, "ERR_GOSTVER_MISSING", {}
end
local content = gost.read_file("GOSTVER")
if not content or #content:match("^%s*(.-)%s*$") == 0 then
    return false, "ERR_GOSTVER_EMPTY", {}
end
return true
'''
[rules.GOST-001.messages]
ERR_GOSTVER_MISSING = "Root GOSTVER file is missing"
ERR_GOSTVER_EMPTY = "Root GOSTVER file is empty"

