# GOST v3.0.0 — Catálogo de Tradução das Regras Fundamentais (pt-BR)
# Tier 1: Axiomas Fundamentais

[rules.GOST-001]
description = "O repositório deve conter um arquivo GOSTVER não vazio no diretório raiz declarando a especificação GOST adotada"
[rules.GOST-001.messages]
ERR_GOSTVER_MISSING = "Arquivo GOSTVER não encontrado na raiz do repositório"
ERR_GOSTVER_EMPTY = "Arquivo GOSTVER está vazio"

[rules.GOST-002]
description = "O repositório deve conter um arquivo LICENSE não vazio no diretório raiz"
[rules.GOST-002.messages]
ERR_LICENSE_MISSING = "Arquivo LICENSE não encontrado na raiz do repositório"
ERR_LICENSE_EMPTY = "Arquivo LICENSE está vazio"

[rules.GOST-003]
description = "O arquivo VERSION deve conter uma versão válida segundo a especificação SemVer 2.0.0"
[rules.GOST-003.messages]
ERR_VERSION_MISSING = "Arquivo VERSION não encontrado na raiz do repositório"
ERR_VERSION_EMPTY = "Arquivo VERSION está vazio"
ERR_VERSION_SEMVER_INVALID = "Versão '{version}' não é uma sequência válida de SemVer 2.0"

[rules.GOST-004]
description = "O repositório deve conter um arquivo README.md não vazio no diretório raiz"
[rules.GOST-004.messages]
ERR_README_MISSING = "Arquivo README.md não encontrado na raiz do repositório"
ERR_README_EMPTY = "Arquivo README.md está vazio"

[rules.GOST-005]
description = "Tolerância zero a arquivos binários compilados (.apk, .exe, .so, .bin, .dll, .dylib) versionados no git"
[rules.GOST-005.messages]
ERR_BINARY_IN_GIT = "Arquivo binário pré-compilado detectado no repositório git: {file}"
